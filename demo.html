<!doctype html><html lang="zh"><meta charset="utf-8"><title>学习资料检索 Agent</title><style>body{max-width:850px;margin:60px auto;font:18px/1.8 system-ui;background:#f4f6fa;color:#19233a}textarea{width:95%;height:100px;padding:16px;font:inherit}button{padding:12px 30px;background:#234e96;color:white;border:0;border-radius:8px}pre{white-space:pre-wrap;background:white;padding:24px;border-radius:12px}small{color:#556}</style><h1>学习资料检索与问题分流 Agent</h1><p>输入机器学习课程问题，查看检索摘要、来源与处理步骤。</p><textarea id="q">过拟合怎么办</textarea><p><button onclick="ask()">检索学习资料</button></p><small>本地运行 · 固定知识库 · 资料不足时请求复核</small><pre id="out">等待输入</pre><script>async function ask(){try{let r=await fetch('/query',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({query:document.getElementById('q').value})});let d=await r.json();document.getElementById('out').textContent=JSON.stringify(d,null,2)}catch(e){document.getElementById('out').textContent='连接失败，请检查本地服务。'}}</script></html>
